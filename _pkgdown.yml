url: https://amannj.github.io/OECDsppps/

template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    primary: "#003A8C"
    secondary: "#5C6770"
    success: "#4C9F38"
    base_font:
      google: Source Sans 3
    heading_font:
      google: Source Sans 3
    code_font:
      google: Source Code Pro

navbar:
  bg: primary
  type: dark
  structure:
    left: [home, reference, articles, news]
    right: [search, github]
  components:
      home:
        text: "Home"
        href: index.html
      reference:
        text: "Reference"
        href: reference/index.html
      articles:
        text: "Articles"
        menu:
          - text: "Implementation"
            href: articles/Implementation.html
          - text: "Validation"
            href: articles/Validation.html
          - text: "Estimation"
            href: articles/Estimation.html
          - text: -------
          - text: "Alternative Software"
            href: articles/altSoftware.html
      news:
        text: "News"
        href: news/index.html

reference:
  - title: "Validation"
    desc: "Functions for validating data and price estimates and indices"
    contents:
      - valid_apt
      - valid_dikhanov
      - valid_est
      - valid_pls
      - valid_outlier_plot
      - valid_pot
      - valid_ratio_ppp
      - valid_ratio_xr
  - title: "Estimation at basic-heading level"
    desc: "Functions for estimating price indices at basic-heading level"
    contents:
      - estim_cpd
      - estim_index_link
  - title: "Estimation beyond the basic-heading level"
    desc: "Functions for calculating multilateral price indices following the Gini-Éltetö-Köves-Szulc (GEKS) method"
    contents:
      - index_fisher
      - index_geks
      - index_laspeyres
      - index_paasche
  - title: "Concordance and reference tables"
    desc: "A selection of concordance and reference tables to facilitate the creation of subnational PPPs"
    contents:
      - oecd_tl
      - ecoicop16_names
      - concordance_ecoicop2bh
  - title: "Sample data"
    desc: "Sample data to illustrate the functionality of OECDsppps"
    contents:
      - uk_cpi
      - uk_hhe
      - sampledata_prices
      - sampledata_weights
      - sampledata_multi_period
